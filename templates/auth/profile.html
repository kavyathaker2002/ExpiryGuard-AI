{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ t('profile_title') }}</h1>
    <p class="page-subtitle">{{ t('profile_subtitle') }}</p>
  </div>
</div>

<div style="max-width: 580px; margin: 0 auto;">
  <div class="card">
    <form method="POST" action="{{ url_for('auth.profile') }}">
      <div class="form-group">
        <label class="form-label" for="profile_shop_name">{{ t('shop_name') }}</label>
        <input type="text" id="profile_shop_name" name="shop_name" class="form-input" 
               value="{{ user['shop_name'] }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="profile_username">{{ t('username') }}</label>
        <input type="text" id="profile_username" class="form-input" 
               value="{{ user['username'] }}" disabled style="background-color: var(--bg-subtle); color: var(--text-light);">
        <small class="text-muted">Username cannot be changed.</small>
      </div>

      <div class="form-group">
        <label class="form-label" for="profile_lang">{{ t('select_language') }}</label>
        <select id="profile_lang" name="preferred_language" class="form-input">
          <option value="en" {{ 'selected' if user['preferred_language'] == 'en' else '' }}>English</option>
          <option value="hi" {{ 'selected' if user['preferred_language'] == 'hi' else '' }}>हिन्दी (Hindi)</option>
          <option value="mr" {{ 'selected' if user['preferred_language'] == 'mr' else '' }}>मराठी (Marathi)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="profile_new_pw">Change Password (leave blank to keep current)</label>
        <input type="password" id="profile_new_pw" name="new_password" class="form-input" 
               placeholder="Enter new password">
      </div>

      <div class="mt-4 d-flex justify-between align-center">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">{{ t('btn_cancel') }}</a>
        <button type="submit" class="btn btn-primary">{{ t('btn_save_changes') }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
