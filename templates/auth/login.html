{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto 20px auto;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-color: var(--primary-border);">
    <div class="text-center mb-4">
      <div class="brand-icon" style="width: 54px; height: 54px; font-size: 28px; margin: 0 auto 12px auto;">🛡️</div>
      <h1 class="page-title" style="font-size: 1.5rem;">{{ t('login_title') }}</h1>
      <p class="page-subtitle" style="font-size: 0.9rem;">{{ t('login_subtitle') }}</p>
    </div>


    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="username">{{ t('username') }}</label>
        <input type="text" id="username" name="username" class="form-input" 
               placeholder="{{ t('username_placeholder') }}" 
               value="{{ username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">{{ t('password') }}</label>
        <input type="password" id="password" name="password" class="form-input" 
               placeholder="{{ t('password_placeholder') }}" required>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          {{ t('login_button') }}
        </button>
      </div>
    </form>

    <div class="text-center mt-4" style="padding-top: 14px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem;">
      <span class="text-muted">{{ t('no_account') }}</span>
      <a href="{{ url_for('auth.register') }}" style="color: var(--primary-hover); font-weight: 700; text-decoration: none; margin-left: 6px;">
        {{ t('register_button') }}
      </a>
    </div>

    <div class="text-center mt-3">
      <a href="{{ url_for('connect.download_apk') }}" class="btn btn-outline btn-block" style="padding: 10px; font-size: 0.88rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
        📲 Download Android App (.apk)
      </a>
    </div>
  </div>
</div>
{% endblock %}
