services:
  - type: web
    name: expiryguard-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn_config.py
    plan: free
    envVars:
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        value: ""
    disk:
      name: expiryguard-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
